# Combo to leave Telmi mode (Konami-style). Space separated, max delay between two presses in seconds.
# Names: UP DOWN LEFT RIGHT A B X Y L R L2 R2 SELECT START
COMBO=UP UP DOWN DOWN LEFT RIGHT LEFT RIGHT B A
# Second accepted combo (the "alternating" variant: up, down, up, down...). Built in by default too.
COMBO2=UP DOWN UP DOWN LEFT RIGHT LEFT RIGHT B A
TIMEOUT=3.0

# Optional per-button overrides with raw evdev key codes (comma separated), e.g. after running
#   sudo /usr/local/bin/modeswitch_daemon.py --learn
# MAP_A=305
# MAP_B=304
